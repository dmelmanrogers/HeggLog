name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-tracker:
    name: Docs and tracker
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run lint gate
        run: scripts/lint.sh

  build-test:
    name: ${{ matrix.os }} / GHC ${{ matrix.ghc }}
    runs-on: ${{ matrix.os }}
    needs: docs-and-tracker

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ghc: "9.10.1"
            cabal: "3.12.1.0"
            install-toolchain: sudo apt-get update && sudo apt-get install -y clang llvm
            strict-native: true
          - os: macos-latest
            ghc: "9.10.1"
            cabal: "3.12.1.0"
            install-toolchain: brew install llvm || brew upgrade llvm
            strict-native: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native toolchain
        run: ${{ matrix.install-toolchain }}

      - name: Expose Homebrew LLVM tools
        if: runner.os == 'macOS'
        run: |
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Show native toolchain
        run: scripts/check-native-toolchain.sh

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}
          enable-stack: false

      - name: Update package index
        run: cabal update

      - name: Build all targets
        run: cabal build all

      - name: Run full test suite
        run: cabal test all --test-options='--hide-successes'

      - name: Check package metadata
        run: cabal check

      - name: Run strict native smoke tests
        run: scripts/smoke-test.sh --strict-native

      - name: Run install smoke test
        run: scripts/install-smoke-test.sh

      - name: Run examples gallery smoke test
        run: scripts/examples-gallery-smoke.sh

      - name: Validate standard library packaging
        run: scripts/validate-standard-library-packaging.sh

      - name: Run runtime build integration smoke test
        run: scripts/runtime-build-smoke.sh

      - name: Run mandatory end-to-end wet tests
        run: scripts/e2e-wet-test.sh

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang llvm

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10.1"
          cabal-version: "3.12.1.0"
          enable-stack: false

      - name: Update package index
        run: cabal update

      - name: Run coverage report
        run: scripts/coverage-report.sh

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang llvm

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10.1"
          cabal-version: "3.12.1.0"
          enable-stack: false

      - name: Update package index
        run: cabal update

      - name: Run benchmark suite
        run: scripts/benchmark.py --iterations 1
